---
name: Austrian Smart Meter
version: "0.1.0"
slug: smartmeter
description: >-
  Reads the M-Bus customer interface of an Austrian smart meter and publishes
  voltage, current, power and energy to Home Assistant over MQTT.
url: https://github.com/Alexander423/ha-smartmeter-at
# No profile has been confirmed against a physical meter yet.
stage: experimental
arch:
  - aarch64
  - amd64
# Required with an s6-overlay base image: the image brings its own init and
# Docker's would fight with it.
init: false
startup: application
boot: auto
# suggested_display_precision and the discovery origin block need this.
homeassistant: "2024.1.0"

# Maps every serial device on the host into the container, so the device
# dropdown below has something to list.
uart: true

# Supervisor injects the broker address and credentials, so the user is never
# asked for them.
services:
  - mqtt:need

# Capture files are written here, where the user can reach them through the
# file editor or Samba add-on.
map:
  - addon_config:rw

ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: Smart meter

options:
  supplier: tinetz
  min_publish_interval: 0
  stale_after: 30
  capture_raw: false
  log_level: info

schema:
  # The grid operator. Anything other than tinetz and salzburg-netz has not
  # been checked against that operator's own documentation.
  supplier: >-
    list(tinetz|salzburg-netz|ikb|vorarlberger-energienetze|evn-netz-noe|kaernten-netz|generic-ksm-west)
  # Renders as a dropdown of the serial devices actually attached to the host.
  # Optional so that replay mode works on a machine with no adapter; the add-on
  # asks for it with a proper explanation when it is really needed.
  port: device(subsystem=tty)?
  # The 128 bit key from the grid operator, 32 hexadecimal characters. Checked
  # here so a typo is caught before the add-on starts.
  key: match(^[0-9A-Fa-f]{32}$)
  # Only if your operator issued a second key for authentication. Almost nobody
  # does.
  auth_key: match(^[0-9A-Fa-f]{32}$)?
  # 0 publishes every telegram, which is one database write every 5 seconds.
  min_publish_interval: int(0,3600)
  # Entities go unavailable after this many seconds without a telegram.
  stale_after: int(5,3600)
  # Writes received frames to /config/captures so they can be sent with a bug
  # report. Stops on its own after 2000 frames.
  capture_raw: bool
  # Overrides the device name in Home Assistant.
  device_name: str?
  # Development only: read frames from a hex file instead of the serial port.
  replay_file: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
