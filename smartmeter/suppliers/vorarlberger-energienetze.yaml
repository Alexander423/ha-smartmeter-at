# Vorarlberger Energienetze (VEN, formerly VKW Netz)
#
# Member of the KSM West cooperation. The Oesterreichs Energie overview lists
# VEN with the Kaifa MA110M and MA309M on M-Bus, and esphome-dlms-meter names
# Vorarlberger Energienetze among the operators its Kaifa component serves.
name: Vorarlberger Energienetze
status: assumed
regions: [Vorarlberg]
interface: mbus
manufacturer: Kaifa
model: MA309M / MA110M

tsap: [0x01, 0x67]
reassembly_timeout: 15.0

security_control: 0x21
header_order: sc_fc

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "1-0:32.7.0.255"
  - "1-0:31.7.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"

notes: >-
  Meter and interface confirmed from the Oesterreichs Energie overview, frame
  details copied from the TINETZ reference.

key_source: >-
  Request the customer interface and the key from Vorarlberger Energienetze.
