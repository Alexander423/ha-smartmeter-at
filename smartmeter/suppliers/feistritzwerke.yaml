# Feistritzwerke STEWEAG
#
# Listed with Energienetze Steiermark and Graz in the Oesterreichs Energie
# overview, sharing the Sagemcom meters and the P1 interface.
name: Feistritzwerke
status: assumed
regions: [Steiermark]
interface: p1
manufacturer: Sagemcom
model: T216-D / S210

tsap: null
reassembly_timeout: 15.0

security_control: 0x30
header_order: auto
auth_key_expected: true

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"

notes: >-
  Needs a USB P1 cable, not an M-Bus adapter. Nothing here has been confirmed
  against a Feistritzwerke meter.

key_source: >-
  Request activation of the customer interface from Feistritzwerke.
