# IKB - Innsbrucker Kommunalbetriebe
#
# Member of the KSM West cooperation, and the Oesterreichs Energie overview
# lists IKB with the Kaifa MA110M and MA309M on M-Bus, the same meters as
# TINETZ. No IKB document has been read, so the frame details are inherited from
# the TINETZ reference rather than confirmed.
name: IKB (Innsbrucker Kommunalbetriebe)
status: assumed
regions: [Tirol]
interface: mbus
manufacturer: Kaifa
model: MA309M / MA110M

tsap: [0x01, 0x67]
reassembly_timeout: 15.0

security_control: 0x21
header_order: sc_fc

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "1-0:32.7.0.255"
  - "1-0:31.7.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"

notes: >-
  The meter and the interface are confirmed from the Oesterreichs Energie
  overview. The frame details are copied from TINETZ on the strength of the
  shared KSM West specification.

key_source: >-
  Request the key from IKB customer service. It is issued as 32 hexadecimal
  characters.
