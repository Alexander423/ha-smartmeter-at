# TINETZ - Tiroler Netze
#
# Reference profile. Every field here comes from the TINETZ document
# "Technische Beschreibung Kundenschnittstelle". Nothing has been checked
# against a physical meter yet, so the status is "documented", not "verified".
#
# Part of the KSM West specification, shared with Salzburg Netz, IKB and
# Vorarlberger Energienetze.
name: TINETZ (Tiroler Netze)
status: documented
manufacturer: Sagemcom
model: T210-D (M-Bus customer interface)

serial:
  baudrate: 2400
  bytesize: 8
  parity: E
  stopbits: 1

# STSAP 0x01 is the Management Logical Device, DTSAP 0x67 the Consumer
# Information Push Client 103.
tsap: [0x01, 0x67]
reassembly_timeout: 15.0

# Security Suite 1, encryption applied, unicast key set.
security_control: 0x21
header_order: sc_fc

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "0-0:42.0.0.255"
  - "1-0:32.7.0.255"
  - "1-0:52.7.0.255"
  - "1-0:72.7.0.255"
  - "1-0:31.7.0.255"
  - "1-0:51.7.0.255"
  - "1-0:71.7.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"
  - "1-0:3.8.0.255"
  - "1-0:4.8.0.255"

notes: >-
  Single-phase meters send only the L1 voltage and current. The missing L2 and
  L3 values are normal and no entities are created for them.

key_source: >-
  Request the customer interface and the key in the TINETZ customer portal. The
  key arrives by post as 32 hexadecimal characters.
