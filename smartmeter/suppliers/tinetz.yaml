# TINETZ - Tiroler Netze
#
# Reference profile. The frame layout comes from the TINETZ document
# "Technische Beschreibung Kundenschnittstelle", part of the KSM West
# specification shared with Salzburg Netz, IKB and Vorarlberger Energienetze.
#
# The meter is a Kaifa, not a Sagemcom. Confirmed three ways: the Oesterreichs
# Energie overview of Austrian meter types lists TINETZ with the Kaifa MA110M
# and MA309M on M-Bus, esphome-dlms-meter names TINETZ among the operators its
# Kaifa MA309M component serves, and a Tyrolean user of this add-on has an
# MA309MH4LAT1 in the meter cabinet.
name: TINETZ (Tiroler Netze)
status: documented
regions: [Tirol]
interface: mbus
manufacturer: Kaifa
model: MA309M / MA110M

# STSAP 0x01 is the Management Logical Device, DTSAP 0x67 the Consumer
# Information Push Client 103.
tsap: [0x01, 0x67]
reassembly_timeout: 15.0

# Security Suite 1, encryption applied, unicast key set. The authentication bit
# is clear, so there is no GCM tag on the wire and one key is issued.
security_control: 0x21
header_order: sc_fc

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "0-0:42.0.0.255"
  - "1-0:32.7.0.255"
  - "1-0:52.7.0.255"
  - "1-0:72.7.0.255"
  - "1-0:31.7.0.255"
  - "1-0:51.7.0.255"
  - "1-0:71.7.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"
  - "1-0:3.8.0.255"
  - "1-0:4.8.0.255"

notes: >-
  Three-phase meters are the MA309M, single-phase the MA110M. A single-phase
  meter sends only the L1 voltage and current, and no entities are created for
  the phases it leaves out.

key_source: >-
  Request the customer interface in the TINETZ customer portal. The key arrives
  by post as 32 hexadecimal characters.
