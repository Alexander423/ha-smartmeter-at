# Generic KSM West
#
# Fallback for an operator with no profile of its own. Assumes only the physical
# layer, which is the same everywhere in Austria, and works the rest out from
# the first telegram: whether TSAP bytes are present, which order the security
# control byte and frame counter come in, and which OBIS codes the meter sends.
#
# Use this to find out whether your meter works at all, then send a capture so a
# named profile can be added.
name: Generic (auto-detect)
status: assumed
manufacturer: Unknown
model: Smart meter (M-Bus customer interface)

serial:
  baudrate: 2400
  bytesize: 8
  parity: E
  stopbits: 1

tsap: auto
reassembly_timeout: 15.0

security_control: 0x21
header_order: auto

layout: obis_tagged

# Deliberately empty: nothing is expected, so nothing is reported missing.
expected_obis: []

notes: >-
  Detects the frame layout from the first telegram. Everything the meter sends
  and this add-on knows about is published; anything else is ignored.

key_source: >-
  Every Austrian grid operator issues the key on request, as 32 hexadecimal
  characters, usually by post.
