# Salzburg Netz
#
# Salzburg Netz publishes its own "Smart Meter Detailbeschreibung" with the same
# customer interface as the TINETZ document, both being part of KSM West. The
# Oesterreichs Energie overview lists Salzburg Netz with the Kaifa MA110M and
# MA309M on M-Bus.
name: Salzburg Netz
status: documented
regions: [Salzburg]
interface: mbus
manufacturer: Kaifa
model: MA309M / MA110M

tsap: [0x01, 0x67]
reassembly_timeout: 15.0

security_control: 0x21
header_order: sc_fc

layout: obis_tagged

expected_obis:
  - "0-0:1.0.0.255"
  - "0-0:96.1.0.255"
  - "0-0:42.0.0.255"
  - "1-0:32.7.0.255"
  - "1-0:52.7.0.255"
  - "1-0:72.7.0.255"
  - "1-0:31.7.0.255"
  - "1-0:51.7.0.255"
  - "1-0:71.7.0.255"
  - "1-0:1.7.0.255"
  - "1-0:2.7.0.255"
  - "1-0:1.8.0.255"
  - "1-0:2.8.0.255"
  - "1-0:3.8.0.255"
  - "1-0:4.8.0.255"

notes: >-
  Salzburg Netz also installs Honeywell meters in some places. Those use the P1
  interface instead and will not work with this profile: choose the generic P1
  profile and an appropriate cable.

key_source: >-
  Order the customer interface in the Salzburg Netz portal. The key is sent by
  post as 32 hexadecimal characters.
