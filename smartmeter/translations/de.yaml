---
configuration:
  supplier:
    name: Netzbetreiber
    description: >-
      Ihr Netzbetreiber, also die Firma, der der Zaehler gehoert, nicht Ihr
      Stromlieferant. Davon haengt auch das noetige Kabel ab: die westlichen
      Betreiber und Netz NOE verwenden M-Bus, die steirischen und Kaernten Netz
      ein P1-Kabel, Wiener Netze einen Infrarot-Lesekopf. Netz Oberoesterreich,
      Linz Netz und Energie Klagenfurt stehen nur in der Liste, um zu erklaeren,
      dass ihre Zaehler mit diesem Add-on nicht gelesen werden koennen.
  port:
    name: Adapter
    description: >-
      Das serielle Geraet, unter dem Ihr Adapter erscheint. Ist die Liste leer,
      steckt der Adapter nicht oder wurde nicht erkannt. Achten Sie auf den
      richtigen Typ: M-Bus-Slave-Modul, P1-Kabel und Infrarot-Lesekopf sind
      nicht austauschbar.
  key:
    name: Schluessel
    description: >-
      Die 32 Zeichen, die Sie von Ihrem Netzbetreiber erhalten haben. Bei zwei
      Schluesseln ist das der GUEK. Kopieren Sie ihn, tippen Sie ihn nicht ab.
      Er verlaesst dieses Add-on nicht und wird nie ins Protokoll geschrieben.
  auth_key:
    name: Authentifizierungsschluessel
    description: >-
      Der zweite Schluessel, sofern Ihr Netzbetreiber einen ausgibt. Bei den
      P1-Betreibern ist das so: im Portal stehen ein GUEK und ein GAK, hier
      gehoert der GAK hinein. Damit wird jedes Telegramm zusaetzlich auf
      Echtheit geprueft. Sonst leer lassen.
  min_publish_interval:
    name: Mindestabstand zwischen Aktualisierungen in Sekunden
    description: >-
      Der Zaehler sendet alle 5 Sekunden ein Telegramm; 0 veroeffentlicht alle,
      das sind rund 17000 Datenbankeintraege pro Sensor und Tag. 30 oder 60
      reduziert das, macht die Leistungskurve aber grober. Die Zaehlerstaende
      bleiben in beiden Faellen korrekt.
  stale_after:
    name: Sekunden bis Entitaeten als nicht verfuegbar gelten
    description: >-
      Wie lange nach dem letzten Telegramm gewartet wird, bevor die Sensoren in
      Home Assistant auf nicht verfuegbar gesetzt werden. 30 entspricht sechs
      ausgefallenen Telegrammen.
  capture_raw:
    name: Rohdaten mitschneiden
    description: >-
      Schreibt die empfangenen Frames nach /config/captures, damit sie einem
      Fehlerbericht beigelegt werden koennen. Der Schluessel steht nicht in der
      Datei. Der Mitschnitt endet nach 2000 Frames von selbst.
  device_name:
    name: Geraetename
    description: >-
      Wie der Zaehler in Home Assistant heissen soll. Leer lassen, um die
      Zaehlernummer zu verwenden.
  replay_file:
    name: Wiedergabedatei
    description: >-
      Entwickleroption. Liest Frames aus dieser Datei statt von der seriellen
      Schnittstelle. So wird dieses Add-on ohne Adapter entwickelt.
  log_level:
    name: Protokollstufe
    description: >-
      Auf info belassen. Debug ergaenzt einen Hex-Dump jedes Frames; genau das
      wird gebraucht, wenn etwas nicht dekodiert wird.
