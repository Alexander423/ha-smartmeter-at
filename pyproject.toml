[project]
name = "ha-smartmeter-at"
version = "0.1.0"
description = "Reads the M-Bus customer interface of Austrian smart meters and publishes to Home Assistant over MQTT."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.10,<4",
    "cryptography>=42,<47",
    "paho-mqtt>=2.1,<3",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
ha-smartmeter = "ha_smartmeter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartmeter/app/ha_smartmeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["smartmeter/app"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:ha_smartmeter.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["smartmeter/app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # function call in default argument, deliberate for frozen defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
